[audio]
enable_overdrive = true

[bar.default]
icon_color = "primary"
margin_ends = 50
radius_top_left = 0
radius_top_right = 0
scale = 1.2500000111758709
shadow = false
start = [ "launcher", "wallpaper", "workspaces", "dns-switcher", "bar" ]
widget_spacing = 8

[battery]
warning_threshold = 20

[brightness]
minimum_brightness = 0.099999997764825821

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
wallpaper_changed = "ln -sf \"$NOCTALIA_WALLPAPER_PATH\" \"$HOME/.cache/current_wallpaper\""

[keybinds]
validate = [ "Return", "KP_Enter" ]

[location]
address = "Kharghar"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 1098.0
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.99999997764825821
layer = "overlay"

[osd]
background_opacity = 0.99999997764825821
position = "top_right"
position_vertical = "center_right"

[plugins]
auto_update = "none"
enabled = [ "nightwatch75/dns-switcher", "azokyen/spotify-media" ]

[shell]
polkit_agent = true
popup_shadows = false
screen_time_enabled = true
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    list_item_background = true
    open_near_click_clipboard = true
    polkit_placement = "attached"
    shadow = false
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.session]
    grid_columns = 2

[theme]
builtin = "Noctalia"
community_palette = "Tokyo Night Storm"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/pp/wallpapers"

    [wallpaper.default]
    path = "/home/pp/wallpapers/wallhaven-qrmjwl_2560x1600.png"

    [wallpaper.last]
    path = "/home/pp/wallpapers/wallhaven-qrmjwl_2560x1600.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/pp/wallpapers/wallhaven-qrmjwl_2560x1600.png"

[widget.bar]
capsule = true
capsule_radius = "auto"
enable_scroll = false
type = "azokyen/spotify-media:bar"

    [widget.bar.actions]
    left = "exec spotify"

[widget.dns-switcher]
type = "nightwatch75/dns-switcher:dns-switcher"
