### ──────────────────────────────
### 🖥️ Terminal & Display
### ──────────────────────────────

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-kitty:RGB"

# Performance
set -g mouse on
set -s escape-time 0
set -sg repeat-time 1500
set -g status-interval 30

# Status bar
set -g status-position top
set -g status-justify centre
set -g status-bg "#18191a"
set -g status-fg "#a1b3b9"
set -g status-style "bg=default"

# Window titles
set -g window-status-format '#[fg=grey,dim]#I:#W-'
set -g window-status-current-format '#[bold]#[fg=blue]#I:#W*#[default]'
set -g window-status-current-style "fg=blue,bold"

# Pane borders
set -g pane-border-style 'fg=#f20e12'
set -g pane-active-border-style 'fg=#0ef20e'

# Prefix indicator (tmux-prefix-highlight)
set -g @prefix_highlight_fg '#a1b3b9'
set -g @prefix_highlight_bg '#18191a'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow,bold'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=green'

set -g status-right "#{prefix_highlight}"

# image.nvim / kitty graphics support
set -gq allow-passthrough on
set -g visual-activity off
set -g focus-events on

### ──────────────────────────────
### 🎛️ Prefix & Configuration
### ──────────────────────────────

# Prefix key
unbind C-b
set -g prefix C-f
bind-key C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

### ──────────────────────────────
### 📑 Session & Window Defaults
### ──────────────────────────────

# Start numbering from 1
set -g base-index 1
set -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Vim motions in copy mode
setw -g mode-keys vi

### ──────────────────────────────
### 🪟 Pane Navigation
### ──────────────────────────────

# Smart navigation between tmux and Neovim splits
bind -n C-h if-shell "ps -o comm= -t '#{pane_tty}' | grep -iqE 'n?vim'" \
  "send-keys C-h" "select-pane -L"

bind -n C-j if-shell "ps -o comm= -t '#{pane_tty}' | grep -iqE 'n?vim'" \
  "send-keys C-j" "select-pane -D"

bind -n C-k if-shell "ps -o comm= -t '#{pane_tty}' | grep -iqE 'n?vim'" \
  "send-keys C-k" "select-pane -U"

bind -n C-l if-shell "ps -o comm= -t '#{pane_tty}' | grep -iqE 'n?vim'" \
  "send-keys C-l" "select-pane -R"

# Clear terminal
bind C-l send-keys C-l

### ──────────────────────────────
### 📏 Pane Management
### ──────────────────────────────

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes in current directory
bind "'" split-window -h -c "#{pane_current_path}"
bind "]" split-window -v -c "#{pane_current_path}"

### ──────────────────────────────
### 🗂️ Window Navigation
### ──────────────────────────────

# Previous / next window
bind -n M-h previous-window
bind -n M-l next-window

### ──────────────────────────────
### 🔍 Utilities
### ──────────────────────────────

# Sessionizer
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

### ──────────────────────────────
### 📋 Copy Mode (Vim Style)
### ──────────────────────────────

# Enter copy mode
bind v copy-mode

# Visual selection
bind-key -T copy-mode-vi v send -X begin-selection

# Yank and exit copy mode
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Avoid mouse drag conflicts
unbind -T copy-mode-vi MouseDragEnd1Pane

### ──────────────────────────────
### 🔌 Plugins (TPM)
### ──────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# TPM must be last
run '~/.tmux/plugins/tpm/tpm'
