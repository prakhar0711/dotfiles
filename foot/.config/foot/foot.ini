[main]
# Use foot's native terminfo for proper feature detection (truecolor, sixel, underline styles)
term=foot
font=JetBrainsMono Nerd Font:size=16
# Pad terminal edges so text does not touch window borders
pad=10x10 center

[scrollback]
# Generous scrollback buffer for long command outputs
lines=10000
multiplier=3.0

[url]
# Open clicked URLs directly in default browser
launch=xdg-open ${url}

[mouse]
# Hide mouse cursor immediately when typing starts
hide-when-typing=yes

[text-bindings]
# \x1b is Escape (Meta)
# Pressing Super+h will send Esc+h (M-h to tmux)
\x1bh=Mod4+h
# Pressing Super+l will send Esc+l (M-l to tmux)
\x1bl=Mod4+l

[colors-dark]
alpha=0.8
blur=yes
foreground=c0caf5
background=000000

## Selection
selection-foreground=c0caf5
selection-background=283457

## Cursor
## cursor=1a1b26 c0caf5

## URLs
urls=73daca

## Normal / Regular colors (color0 - color7)
regular0=15161e  # black
regular1=f7768e  # red
regular2=518a9c  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=bb9af7  # magenta
regular6=7dcfff  # cyan
regular7=a9b1d6  # white

## Bright colors (color8 - color15)
bright0=414868   # bright black
bright1=ff899d   # bright red
bright2=9ece6a   # bright green
bright3=faba4a   # bright yellow
bright4=8db0ff   # bright blue
bright5=c7a9ff   # bright magenta
bright6=a4daff   # bright cyan
bright7=c0caf5   # bright white

## Extended colors (256-color palette index 16 & 17)
16=ff9e64
17=db4b4b
